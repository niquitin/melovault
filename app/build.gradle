plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def carApiPrimary = localProps.getProperty(
    'car.api.primary',
    'http://100.82.19.36:8790'
)
def carApiSecondary = localProps.getProperty(
    'car.api.secondary',
    'http://192.168.68.66:8790'
)
// Only the Shareable preview receives this app-wide Telegram developer ID/hash.
// Values come from untracked local.properties decrypted locally on Lenovo.
// NEVER add owner Telegram sessions, bot tokens, or private backend credentials.
def telegramApiId = localProps.getProperty('telegram.api.id', '0').trim()
def telegramApiHash = localProps.getProperty('telegram.api.hash', '').trim()
if (!(telegramApiId ==~ /[0-9]{1,10}/) || !(telegramApiHash ==~ /[a-fA-F0-9]{32}/)) {
    // Gradle can still build Personal/preview stub but login remains disabled.
    telegramApiId = '0'
    telegramApiHash = ''
}
// E96 P5-A: lets a build machine answer "is the Telegram developer config usable?" without ever showing it.
// Prints only true/false; the ID and hash are never written to the console, a log or an artifact.
def meloOpen = (project.findProperty('meloOpen') ?: 'false').toString().trim() == 'true'
tasks.register('reportTelegramConfig') {
    description = 'Prints telegram.config.valid=true|false (never the values).'
    def valid = (!meloOpen && telegramApiId != '0' && telegramApiHash != '')
    doLast { println 'telegram.config.valid=' + valid }
}

// E96 P5B3: the ONLY way cloud Playlist sync is compiled in. Off unless this build is started with -PmeloSyncQa=true, and
// then only for the DEBUG build type (its version name gets "-syncqa" so a QA candidate can never pass for a normal Beta).
// Release always has it off: asking for both is an error, never a silent downgrade. It is not read from local.properties,
// so a secret file can never switch it on, and it holds no key or id.
def meloSyncQa = (project.findProperty('meloSyncQa') ?: 'false').toString().trim() == 'true'
if (meloOpen && meloSyncQa) {
    throw new GradleException('meloOpen cannot be combined with meloSyncQa')
}
if (meloSyncQa && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('meloSyncQa=true is only allowed for Debug builds; Release always ships with cloud sync OFF.')
}
// E96 P5B3 REWORK-01: creating a Telegram channel is LOCKED in every build. Only a Debug build started with BOTH
// -PmeloSyncQa=true and -PmeloSyncQaAllowCreate=true can unlock it, and Release never can (asking is an error).
// A QA build without it can find and bind an EXISTING channel, never create one.
def meloSyncQaAllowCreate = meloSyncQa && (project.findProperty('meloSyncQaAllowCreate') ?: 'false').toString().trim() == 'true'
if (((project.findProperty('meloSyncQaAllowCreate') ?: 'false').toString().trim() == 'true') &&
        gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('meloSyncQaAllowCreate=true is only allowed for Debug builds; Release never creates channels.')
}
tasks.register('reportSyncQaFlag') {
    description = 'Prints melo.sync.qa=true|false (the Debug build switch for cloud Playlist sync).'
    doLast {
        println 'melo.sync.qa=' + meloSyncQa
        println 'melo.sync.qa.allowcreate=' + meloSyncQaAllowCreate
    }
}

tasks.register('reportOpenBuild') {
    doLast { println 'melo.open=' + meloOpen }
}

tasks.register('verifyOpenApkHasNoTelegramHash') {
    description = 'Checks APK contents without printing credentials or entry names.'
    doLast {
        if (!(telegramApiHash ==~ /[a-fA-F0-9]{32}/)) {
            println 'open.apk.telegram.hash.check=SKIPPED_NO_LOCAL_HASH'
            return
        }
        boolean found = false
        try {
            def path = project.findProperty('openApk')
            if (path == null) throw new IllegalArgumentException()
            def lower = telegramApiHash.toLowerCase(java.util.Locale.ROOT)
            def upper = telegramApiHash.toUpperCase(java.util.Locale.ROOT)
            new java.util.zip.ZipFile(project.file(path)).withCloseable { zip ->
                def entries = zip.entries()
                byte[] buffer = new byte[65536]
                while (entries.hasMoreElements() && !found) {
                    def entry = entries.nextElement()
                    if (entry.isDirectory()) continue
                    zip.getInputStream(entry).withCloseable { stream ->
                        String tail = ''
                        int count
                        while (!found && (count = stream.read(buffer)) != -1) {
                            // ISO-8859-1 maps each byte directly, preserving ASCII matches across chunks.
                            String chunk = tail + new String(buffer, 0, count, java.nio.charset.StandardCharsets.ISO_8859_1)
                            found = chunk.contains(lower) || chunk.contains(upper)
                            tail = chunk.substring(Math.max(0, chunk.length() - 31))
                        }
                    }
                }
            }
        } catch (Exception ignored) {
            // Never attach the underlying exception: it can contain an entry name.
            throw new GradleException('Unable to verify APK Telegram hash contents.')
        }
        println 'open.apk.telegram.hash.found=' + found
        if (found) throw new GradleException('APK contains the local Telegram hash.')
    }
}

android {
    namespace 'com.bsdung.musicassistantcar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bsdung.musicassistantcar'
        minSdk 26
        targetSdk 36
        // Stable Private candidate; promote exact vetted artifact only after all release gates.
        versionCode 61
        versionName '0.6.40'

        buildConfigField 'String', 'CAR_API_TOKEN', '""'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    flavorDimensions 'distribution'
    productFlavors {
        personal {
            dimension 'distribution'
            buildConfigField 'boolean', 'PERSONAL_BACKEND_ENABLED', 'true'
            buildConfigField 'String', 'CAR_API_PRIMARY', '"' + carApiPrimary + '"'
            buildConfigField 'String', 'CAR_API_SECONDARY', '"' + carApiSecondary + '"'
        }
        shareable {
            dimension 'distribution'
            applicationId meloOpen ? 'app.melovault.player.open' : 'app.melovault.player'
            // Owner Beta only: preserve the existing on-device signing identity.
            // Replace with a managed release key before any public distribution.
            signingConfig signingConfigs.debug
            // Beta-only bump; never alter the existing Personal Stable artifact.
            versionCode 120
            versionName '0.6.95'
            versionNameSuffix meloOpen ? '-open' : '-beta'
            buildConfigField 'boolean', 'PERSONAL_BACKEND_ENABLED', 'false'
            buildConfigField 'String', 'CAR_API_PRIMARY', '""'
            buildConfigField 'String', 'CAR_API_SECONDARY', '""'
            buildConfigField 'int', 'TELEGRAM_APP_API_ID', meloOpen ? '0' : telegramApiId
            buildConfigField 'String', 'TELEGRAM_APP_API_HASH', meloOpen ? '""' : ('"' + telegramApiHash + '"')
            buildConfigField 'boolean', 'MELO_OPEN_BUILD', meloOpen ? 'true' : 'false'
        }
    }

    buildTypes {
        debug {
            // Never embed owner/admin credentials in any installable variant.
            buildConfigField 'String', 'CAR_API_TOKEN', '""'
            buildConfigField 'boolean', 'MELO_SYNC_QA_BUILD', meloSyncQa ? 'true' : 'false'
            buildConfigField 'boolean', 'MELO_SYNC_QA_ALLOW_CREATE', meloSyncQaAllowCreate ? 'true' : 'false'
            if (meloSyncQa) versionNameSuffix '-syncqa'
        }
        release {
            buildConfigField 'String', 'CAR_API_TOKEN', '""'
            buildConfigField 'boolean', 'MELO_SYNC_QA_BUILD', 'false'
            buildConfigField 'boolean', 'MELO_SYNC_QA_ALLOW_CREATE', 'false'
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def media3Version = '1.11.1'
    def workVersion = '2.9.1'

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'io.coil-kt:coil:2.6.0'
    implementation "androidx.work:work-runtime-ktx:$workVersion"

    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-database:$media3Version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.xerial:sqlite-jdbc:3.45.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}

