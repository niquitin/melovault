plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def carApiToken = localProps.getProperty('car.api.token', '')
def carApiPrimary = localProps.getProperty(
    'car.api.primary',
    'http://100.82.19.36:8790'
)
def carApiSecondary = localProps.getProperty(
    'car.api.secondary',
    'http://192.168.68.66:8790'
)

android {
    namespace 'com.bsdung.musicassistantcar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bsdung.musicassistantcar'
        minSdk 26
        targetSdk 36
        versionCode 41
        versionName '0.6.21'

        buildConfigField 'String', 'CAR_API_TOKEN',
            '"' + carApiToken.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'String', 'CAR_API_PRIMARY',
            '"' + carApiPrimary + '"'
        buildConfigField 'String', 'CAR_API_SECONDARY',
            '"' + carApiSecondary + '"'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def media3Version = '1.11.1'

    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'io.coil-kt:coil:2.6.0'

    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-database:$media3Version"

    testImplementation 'junit:junit:4.13.2'
}
